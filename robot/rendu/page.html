<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rendu Buzz Insolite</title>
<!-- Page de rendu des vidéos « 100 % fabriquées » (demande de l'auteur du 26/11) : chaque image de la vidéo est dessinée ici
     par rendre(t), puis photographiée par rendre.mjs (30 images par seconde). Rien ne bouge tout seul : tout dépend de t. -->
<style>
@font-face { font-family: "Poppins"; src: url("../../polices/Poppins-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Poppins"; src: url("../../polices/Poppins-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Poppins"; src: url("../../polices/Poppins-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Poppins"; src: url("../../polices/Poppins-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Poppins"; src: url("../../polices/Poppins-Black.ttf"); font-weight: 900; }
:root {
  --rouge: #e8323f; --jaune: #ffd600; --nuit: #0b1222; --nuit2: #16213a; --blanc: #ffffff; --gris: #9aa6bd;
  --ombre: 0 3px 0 rgba(0,0,0,.55), 0 0 22px rgba(0,0,0,.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nuit); }
body { font-family: "Poppins", sans-serif; color: var(--blanc); -webkit-font-smoothing: antialiased; }
#video { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% 35%, var(--nuit2), var(--nuit)); }
canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
#calque, #scenes, #voiles { position: absolute; inset: 0; }
/* dégradés sombres en haut (titre) et en bas (sous-titres) : toujours lisibles, quel que soit le décor */
#voiles { pointer-events: none; background:
  linear-gradient(180deg, rgba(4,8,18,.78) 0, rgba(4,8,18,.45) 330px, rgba(4,8,18,0) 560px),
  linear-gradient(0deg, rgba(4,8,18,.82) 0, rgba(4,8,18,.55) 520px, rgba(4,8,18,0) 780px); }
.couche { position: absolute; inset: 0; will-change: opacity, transform; }

/* ---------- habillage fixe (zones libres de TikTok : rien au-dessus de y = 160, rien à droite de x = 950) ---------- */
#entete { position: absolute; left: 70px; top: 168px; right: 262px; }   /* jamais sous le logo rond */
#marque { display: flex; gap: 14px; align-items: center; font-weight: 800; font-size: 26px; letter-spacing: .06em; }
#marque .pastille { background: var(--rouge); color: #fff; padding: 6px 14px 4px; border-radius: 8px; }
#marque .lieu { color: var(--jaune); text-transform: uppercase; }
#titre { margin-top: 16px; font-weight: 900; font-size: 74px; line-height: 1.02; letter-spacing: -.01em; text-shadow: var(--ombre);
         transform-origin: left top; }
#titre .cle { color: var(--jaune); }
#logo { position: absolute; right: 150px; top: 172px; width: 88px; height: 88px; border-radius: 50%; border: 4px solid #fff;
        box-shadow: 0 4px 18px rgba(0,0,0,.45); background-size: cover; }
#source { position: absolute; left: 70px; right: 150px; top: 1505px; font-weight: 500; font-size: 22px; color: rgba(255,255,255,.62);
          text-shadow: 0 1px 4px rgba(0,0,0,.8); }
#mention { position: absolute; left: 70px; top: 1475px; font-weight: 700; font-size: 20px; color: rgba(255,255,255,.75);
           letter-spacing: .08em; text-transform: uppercase; }

/* ---------- sous-titres : SANS fond noir ; le mot dit surligné en jaune, les mots importants en jaune ---------- */
#soustitres { position: absolute; left: 80px; right: 160px; top: 1270px; height: 200px; display: flex; align-items: center;
              justify-content: center; text-align: center; }
#soustitres .ligne { font-weight: 800; font-size: 60px; line-height: 1.18; text-shadow: var(--ombre); }
#soustitres .mot { display: inline-block; padding: 0 8px; margin: 0 -2px; border-radius: 10px; transition: none; }
#soustitres .mot.cle { color: var(--jaune); }
#soustitres .mot.actif { background: var(--jaune); color: #111; text-shadow: none; }

/* ---------- étiquettes (badges) des scènes ---------- */
.etiquette { position: absolute; font-weight: 800; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; padding: 8px 18px 6px;
             border-radius: 10px; background: var(--jaune); color: #111; box-shadow: 0 6px 18px rgba(0,0,0,.35); white-space: nowrap;
             transform-origin: left center; }
.etiquette.rouge { background: var(--rouge); color: #fff; }
.etiquette.sombre { background: rgba(11,18,34,.86); color: #fff; border: 2px solid rgba(255,255,255,.18); }
.etiquette.contour { background: transparent; color: #fff; border: 3px solid #fff; }
.repere { position: absolute; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 26px; color: #fff;
          text-shadow: 0 2px 6px rgba(0,0,0,.9); white-space: nowrap; transform: translate(-14px, -50%); }
.repere::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--rouge); border: 4px solid #fff;
                  box-shadow: 0 0 0 6px rgba(232,50,63,.35); flex: none; }

/* ---------- gros chiffre ---------- */
.chiffre { position: absolute; left: 0; right: 0; text-align: center; }
.chiffre .valeur { font-weight: 900; font-size: 250px; line-height: 1; letter-spacing: -.03em; text-shadow: var(--ombre); }
.chiffre .unite { font-weight: 800; font-size: 90px; color: var(--jaune); margin-left: 10px; }
.chiffre .texte { margin: 18px auto 0; max-width: 820px; font-weight: 700; font-size: 44px; line-height: 1.2; color: #fff; text-shadow: var(--ombre); }

/* ---------- citation, question, frise ---------- */
.carte-texte { position: absolute; left: 90px; right: 170px; background: #fff; color: #111; border-radius: 26px; padding: 44px 48px;
               box-shadow: 0 24px 60px rgba(0,0,0,.45); border-left: 14px solid var(--jaune); }
.carte-texte .gros { font-weight: 800; font-size: 54px; line-height: 1.18; }
.carte-texte .petit { margin-top: 20px; font-weight: 600; font-size: 30px; color: #555; }
.carte-texte.question { background: var(--jaune); border-left-color: var(--rouge); text-align: center; }
.carte-texte.question .titre { font-weight: 900; font-size: 92px; color: var(--rouge); line-height: 1; }
.frise { position: absolute; left: 110px; right: 190px; }
.frise .etape { position: relative; padding: 0 0 46px 70px; }
.frise .etape::before { content: ""; position: absolute; left: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%;
                        background: var(--nuit2); border: 5px solid var(--jaune); }
.frise .etape::after { content: ""; position: absolute; left: 21px; top: 42px; bottom: -4px; width: 5px; background: rgba(255,255,255,.25); }
.frise .etape:last-child::after { display: none; }
.frise .heure { font-weight: 800; font-size: 34px; color: var(--jaune); }
.frise .quoi { font-weight: 700; font-size: 42px; line-height: 1.2; text-shadow: var(--ombre); }
/* ---------- nouvelles scènes (27/11) : pictogramme géant, document officiel, calendrier, personnages ---------- */
.emoji { font-family: "Noto Color Emoji", "Apple Color Emoji", sans-serif; }
.icone { position: absolute; left: 0; right: 0; text-align: center; }
.icone .picto { font-size: 300px; line-height: 1; filter: drop-shadow(0 26px 30px rgba(0,0,0,.55)); display: inline-block; }
.icone .valeur { margin-top: 26px; font-weight: 900; font-size: 92px; line-height: 1; text-shadow: var(--ombre); }
.icone .texte, .doc-texte { margin: 18px auto 0; max-width: 820px; font-weight: 700; font-size: 42px; line-height: 1.2; text-shadow: var(--ombre); text-align: center; }
.document { position: absolute; left: 190px; width: 620px; height: 640px; background: #fbfaf6; border-radius: 18px; color: #1a1a1a;
            box-shadow: 0 30px 70px rgba(0,0,0,.55); padding: 56px 54px; transform-origin: 50% 60%; }
.document .entete-doc { font-weight: 600; font-size: 24px; letter-spacing: .12em; color: #777; text-transform: uppercase; }
.document .titre-doc { margin-top: 14px; font-weight: 900; font-size: 64px; line-height: 1.05; }
.document .ligne-doc { height: 18px; border-radius: 9px; background: #d9d6ce; margin-top: 30px; transform-origin: left center; }
.document .tampon { position: absolute; right: 40px; bottom: 120px; border: 9px solid var(--rouge); color: var(--rouge); font-weight: 900;
                    font-size: 64px; padding: 6px 26px; border-radius: 16px; letter-spacing: .04em; transform-origin: center; mix-blend-mode: multiply; }
.calendrier { position: absolute; left: 280px; width: 520px; background: #fff; border-radius: 30px; overflow: hidden; color: #111;
              box-shadow: 0 30px 70px rgba(0,0,0,.55); text-align: center; transform-origin: 50% 0; }
.calendrier .mois { background: var(--rouge); color: #fff; font-weight: 900; font-size: 54px; padding: 22px 0 16px; letter-spacing: .04em; }
.calendrier .jour { font-weight: 900; font-size: 260px; line-height: 1.05; padding: 10px 0 0; }
.calendrier .annee { font-weight: 700; font-size: 40px; color: #777; padding-bottom: 30px; }
.foule { position: absolute; left: 110px; right: 190px; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
.foule .perso { width: 120px; height: 170px; }
.credit { position: absolute; right: 160px; font-weight: 500; font-size: 20px; color: rgba(255,255,255,.7); text-shadow: 0 1px 4px #000; }
</style>
</head>
<body>
<div id="video">
  <div id="scenes"></div>
  <div id="voiles"></div>
  <div id="calque">
    <div id="entete"><div id="marque"><span class="pastille">BUZZ INSOLITE</span><span class="lieu"></span></div><div id="titre"></div></div>
    <div id="logo"></div>
    <div id="soustitres"></div>
    <div id="mention"></div>
    <div id="source"></div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="./moteur.js"></script>
</body>
</html>
