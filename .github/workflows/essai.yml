name: Essai complet de la nuit
run-name: "Essai de la nuit"
# Amélioration 16 du 25/11 : chaque maillon de la fabrication est essayé pour de vrai chaque nuit (sans publier ni ajouter
# de vidéo), pour trouver une panne AVANT les vraies vidéos. Résultat dans l'onglet 🩺 Santé.
on:
  schedule:
    - cron: "47 1 * * *"         # 02 h 47 à Paris l'hiver, avant la santé de 04 h 17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: essai-nuit
  cancel-in-progress: false
jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}        # GitHub Models : IA de secours sans clé (permission models: read)
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}   # facultatif
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # facultatif
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}   # facultatif
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6   # installation des outils bien plus rapide (amélioration 12 du 25/11)
      - name: Retrouver ffmpeg, voix et Whisper déjà téléchargés
        uses: actions/cache@v4
        with:
          path: |
            ~/paquets-ffmpeg
            ~/.cache/buzz-insolite
            ~/.cache/buzz-modeles
          key: outils-v1-${{ hashFiles('requirements.txt') }}
      - name: Installer ffmpeg
        timeout-minutes: 25
        run: bash outils/installer_ffmpeg.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrouver le navigateur du rendu animé
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('robot/rendu/package.json') }}
      - name: Installer le rendu animé (Chromium sans écran, nouveau style du 26/11)
        run: |
          npm install --prefix robot/rendu --no-audit --no-fund --silent
          # dépôt apt de Microsoft parfois refusé (403 le 27/11) : il bloquait toute l'installation → retiré, puis 3 essais
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources || true
          for i in 1 2 3; do npx --prefix robot/rendu playwright install --with-deps chromium && break; sleep 20; done
          npx --prefix robot/rendu playwright install chromium
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null   # pictogrammes en couleur (police libre OFL)
      - name: Installer les bibliothèques
        run: |
          uv pip install --system -q -r requirements.txt || pip install -q -r requirements.txt
          # PySceneDetect SANS ses dépendances : il réclame opencv-python (OpenCV 5), qui remplacerait l'OpenCV 4 de
          # requirements.txt et casserait l'agrandissement des photos (OpenCV 5 ne lit plus les modèles .pb)
          uv pip install --system -q --no-deps scenedetect==0.7.3 click platformdirs tqdm || pip install -q --no-deps scenedetect==0.7.3 click platformdirs tqdm
      - name: Installer yt-dlp et deno (vraies vidéos du sujet sous licence libre, YouTube Creative Commons)
        run: uv pip install --system -q -U "yt-dlp[default]" || pip install -q -U yt-dlp
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Retrouver la voix d'homme déjà installée (Chatterbox et son modèle)
        id: cache-chatterbox
        uses: actions/cache@v4
        with:
          path: |
            ~/venv-chatterbox
            ~/.cache/huggingface
          key: chatterbox-v1-py312-0.1.7
      - name: Installer la voix d'homme (Chatterbox, espace à part)
        if: steps.cache-chatterbox.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          python -m venv ~/venv-chatterbox
          ~/venv-chatterbox/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          ~/venv-chatterbox/bin/pip install -q chatterbox-tts==0.1.7
          ~/venv-chatterbox/bin/python -c "from chatterbox.mtl_tts import ChatterboxMultilingualTTS as M; M.from_pretrained(device='cpu')"
      - name: Essayer chaque maillon
        run: python -m robot.essai_nuit
