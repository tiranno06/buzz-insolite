name: Statistiques de la chaîne

on:
  schedule:
    - cron: "23 */3 * * *"       # toutes les 3 heures
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6   # installation des outils bien plus rapide (amélioration 12 du 25/11)
      - name: Installer yt-dlp (lecture du compte TikTok)
        run: uv pip install --system -q -U "yt-dlp[default,curl-cffi]" || pip install -q -U yt-dlp
      - name: Relever les statistiques
        run: python -m robot.stats
