name: Tests

on:
  push:
    paths: ["robot/**", "tests/**", "docs/index.html", ".github/workflows/**"]
  pull_request:                  # mises à jour proposées par Dependabot : testées avant d'être acceptées
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6   # installation des outils bien plus rapide (amélioration 12 du 25/11)
      - name: Installer ffmpeg
        run: bash outils/installer_ffmpeg.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrouver le navigateur du rendu animé
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('robot/rendu/package.json') }}
      - name: Installer le rendu animé (Chromium sans écran, nouveau style du 26/11)
        run: |
          npm install --prefix robot/rendu --no-audit --no-fund --silent
          # dépôt apt de Microsoft parfois refusé (403 le 27/11) : il bloquait toute l'installation → retiré, puis 3 essais
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources || true
          for i in 1 2 3; do npx --prefix robot/rendu playwright install --with-deps chromium && break; sleep 20; done
          npx --prefix robot/rendu playwright install chromium
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null   # pictogrammes en couleur (police libre OFL)
      - name: Installer les bibliothèques
        run: uv pip install --system -q -r requirements.txt pyyaml || pip install -q -r requirements.txt pyyaml
      - name: Tests (aucun appel réseau ni IA)
        run: env -u GITHUB_ACTIONS python -m unittest discover -s tests -v   # jamais d'envoi sur GitHub pendant les tests
