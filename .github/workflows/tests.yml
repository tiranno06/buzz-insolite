name: Tests

on:
  push:
    paths: ["robot/**", "tests/**", "docs/index.html", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6   # installation des outils bien plus rapide (amélioration 12 du 25/11)
      - name: Installer ffmpeg
        run: bash outils/installer_ffmpeg.sh
      - name: Installer les bibliothèques
        run: uv pip install --system -q Pillow pyyaml || pip install -q Pillow pyyaml
      - name: Tests (aucun appel réseau ni IA)
        run: python -m unittest discover -s tests -v
