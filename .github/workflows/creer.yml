name: Créer des vidéos
run-name: "${{ inputs.refaire && format('Refaire {0} ({1})', inputs.refaire, inputs.etape) || format('Créer {0} vidéo(s) {1} {2}', inputs.nombre || '1', inputs.format, inputs.origine) }}"

on:
  workflow_dispatch:             # bouton « 🎬 Créer » du site, ou création automatique (garde.yml)
    inputs:
      nombre:
        description: "Nombre de vidéos (1 à 10)"
        default: "1"
      sujet:
        description: "Identifiant d'un sujet de l'onglet Buzz (facultatif)"
        default: ""
      libre:
        description: "Sujet écrit à la main (facultatif)"
        default: ""
      format:
        description: "buzz, vrai_faux, semaine (3 actus de la semaine), chiffre (chiffre fou), monde60 (monde en 60 s), region (près de chez toi)"
        default: "buzz"
      origine:
        description: "site, auto…"
        default: "site"
      simulation:
        description: "1 = essai sans réseau ni IA"
        default: "0"
      refaire:
        description: "Identifiant d'une vidéo à REFAIRE en corrigeant (facultatif)"
        default: ""
      etape:
        description: "Ce qu'on refait : auto, controle, texte, voix, images ou tout"
        default: "auto"
      remarque:
        description: "Ce qui ne va pas dans la vidéo à refaire (facultatif)"
        default: ""

permissions:
  contents: write                # données du site et Releases (adresse publique des vidéos pour Buffer)
  actions: write                 # vidéo sans assez d'images : refaite tout de suite (principal.reparer_tout_de_suite)

# Plusieurs machines en même temps (demande de l'auteur du 24/11) : le job « plan » répartit les sujets (un sujet + des
# réserves par machine, réservés dans buzz.json), puis « fabriquer » lance une machine par vidéo, N à la fois au plus
# (Réglages → creation.paralleles, 3 par défaut ; dépôt public = machines gratuites).
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      paralleles: ${{ steps.plan.outputs.paralleles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6   # installation des outils bien plus rapide (amélioration 12 du 25/11)
      - name: Installer l'outil d'images (chargé au démarrage du robot)
        run: uv pip install --system -q "Pillow>=11,<14" || pip install -q "Pillow>=11,<14"
      - name: Répartir les vidéos entre les machines
        id: plan
        env:
          LIBRE: ${{ inputs.libre }}
          REMARQUE: ${{ inputs.remarque }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}        # GitHub Models : IA de secours sans clé (permission models: read)
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}   # facultatif
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # facultatif
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}   # facultatif
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        # vérifie d'abord les crédits des IA gratuites : pas assez = création mise en attente (lancée par la garde)
        run: python -m robot.principal --plan --nombre "${{ inputs.nombre || '1' }}" --sujet "${{ inputs.sujet }}" --libre "$LIBRE" --format "${{ inputs.format || 'buzz' }}" --refaire "${{ inputs.refaire }}" --etape "${{ inputs.etape || 'auto' }}" --remarque "$REMARQUE" --origine "${{ inputs.origine }}"

  creer:
    needs: plan
    if: needs.plan.outputs.plan != '[]'    # création mise en attente (IA gratuites saturées) : aucune machine
    runs-on: ubuntu-24.04
    timeout-minutes: 350              # dont l'attente éventuelle dans la file (200 min au plus)
    strategy:
      fail-fast: false               # une vidéo ratée n'arrête jamais les autres
      max-parallel: ${{ fromJSON(needs.plan.outputs.paralleles) }}
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.plan) }}
    env:
      MACHINE: ${{ matrix.machine.k }}
      SIMULATION: ${{ inputs.simulation || '0' }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}        # GitHub Models : IA de secours sans clé (permission models: read)
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}   # facultatif
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # facultatif
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}   # facultatif
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}         # facultatif : vidéos Vimeo sous licence libre
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6   # installation des outils bien plus rapide (amélioration 12 du 25/11)
      - name: Retrouver ffmpeg, voix et Whisper déjà téléchargés
        uses: actions/cache@v4
        with:
          path: |
            ~/paquets-ffmpeg
            ~/.cache/buzz-insolite
            ~/.cache/buzz-modeles
          key: outils-v1-${{ hashFiles('requirements.txt') }}
      - name: Retrouver les dictionnaires de prononciation (WikiPron, Lexique 3.83)
        uses: actions/cache@v4
        with:
          path: ~/.cache/buzz-phonetique
          key: phonetique-v1
      - name: Installer ffmpeg
        timeout-minutes: 25
        run: bash outils/installer_ffmpeg.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrouver le navigateur du rendu animé
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('robot/rendu/package.json') }}
      - name: Installer le rendu animé (Chromium sans écran, nouveau style du 26/11)
        run: |
          npm install --prefix robot/rendu --no-audit --no-fund --silent
          # dépôt apt de Microsoft parfois refusé (403 le 27/11) : il bloquait toute l'installation → retiré, puis 3 essais
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources || true
          for i in 1 2 3; do npx --prefix robot/rendu playwright install --with-deps chromium && break; sleep 20; done
          npx --prefix robot/rendu playwright install chromium
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null   # pictogrammes en couleur (police libre OFL)
      - name: Installer les bibliothèques
        run: |
          uv pip install --system -q -r requirements.txt || pip install -q -r requirements.txt
          # PySceneDetect SANS ses dépendances : il réclame opencv-python (OpenCV 5), qui remplacerait l'OpenCV 4 de
          # requirements.txt et casserait l'agrandissement des photos (OpenCV 5 ne lit plus les modèles .pb)
          uv pip install --system -q --no-deps scenedetect==0.7.3 click platformdirs tqdm || pip install -q --no-deps scenedetect==0.7.3 click platformdirs tqdm
      - name: Installer yt-dlp et deno (vraies vidéos du sujet sous licence libre, YouTube Creative Commons)
        run: uv pip install --system -q -U "yt-dlp[default]" || pip install -q -U yt-dlp
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Retrouver la voix d'homme déjà installée (Chatterbox et son modèle)
        id: cache-chatterbox
        uses: actions/cache@v4
        with:
          path: |
            ~/venv-chatterbox
            ~/.cache/huggingface
          key: chatterbox-v1-py312-0.1.7
      - name: Installer la voix d'homme (Chatterbox, espace à part)
        if: steps.cache-chatterbox.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          python -m venv ~/venv-chatterbox
          ~/venv-chatterbox/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          ~/venv-chatterbox/bin/pip install -q chatterbox-tts==0.1.7
          ~/venv-chatterbox/bin/python -c "from chatterbox.mtl_tts import ChatterboxMultilingualTTS as M; M.from_pretrained(device='cpu')"
      - name: Fabriquer (une vidéo par machine)
        run: python -m robot.principal --nombre 1 --sujet "${{ matrix.machine.sujets }}" --libre "$LIBRE" --format "${{ inputs.format || 'buzz' }}" --refaire "$REFAIRE" --etape "$ETAPE" --remarque "$REMARQUE"
        env:
          LIBRE: ${{ inputs.libre }}
          REFAIRE: ${{ inputs.refaire }}
          ETAPE: ${{ inputs.etape || 'auto' }}
          REMARQUE: ${{ inputs.remarque }}
      - name: "Fabrication annulée, barre d'avancement retirée du site"
        if: cancelled()
        run: python -m robot.avancement --annuler
