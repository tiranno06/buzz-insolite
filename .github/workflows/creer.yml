name: Créer des vidéos
run-name: "${{ inputs.refaire && format('Refaire {0} ({1})', inputs.refaire, inputs.etape) || format('Créer {0} vidéo(s) {1} {2}', inputs.nombre || '1', inputs.format, inputs.origine) }}"

on:
  workflow_dispatch:             # bouton « 🎬 Créer » du site, ou création automatique (garde.yml)
    inputs:
      nombre:
        description: "Nombre de vidéos (1 à 10)"
        default: "1"
      sujet:
        description: "Identifiant d'un sujet de l'onglet Buzz (facultatif)"
        default: ""
      libre:
        description: "Sujet écrit à la main (facultatif)"
        default: ""
      format:
        description: "buzz, vrai_faux, semaine (3 actus de la semaine), chiffre (chiffre fou), monde60 (monde en 60 s), region (près de chez toi)"
        default: "buzz"
      origine:
        description: "site, auto…"
        default: "site"
      simulation:
        description: "1 = essai sans réseau ni IA"
        default: "0"
      refaire:
        description: "Identifiant d'une vidéo à REFAIRE en corrigeant (facultatif)"
        default: ""
      etape:
        description: "Ce qu'on refait : auto, texte, voix, images ou tout"
        default: "auto"
      remarque:
        description: "Ce qui ne va pas dans la vidéo à refaire (facultatif)"
        default: ""

permissions:
  contents: write                # données du site et Releases (adresse publique des vidéos pour Buffer)

# Plusieurs machines en même temps (demande de l'auteur du 24/11) : le job « plan » répartit les sujets (un sujet + des
# réserves par machine, réservés dans buzz.json), puis « fabriquer » lance une machine par vidéo, N à la fois au plus
# (Réglages → creation.paralleles, 3 par défaut ; dépôt public = machines gratuites).
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      paralleles: ${{ steps.plan.outputs.paralleles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer l'outil d'images (chargé au démarrage du robot)
        run: pip install -q "Pillow>=11,<14"
      - name: Répartir les vidéos entre les machines
        id: plan
        env:
          LIBRE: ${{ inputs.libre }}
        run: python -m robot.principal --plan --nombre "${{ inputs.nombre || '1' }}" --sujet "${{ inputs.sujet }}" --libre "$LIBRE" --format "${{ inputs.format || 'buzz' }}" --refaire "${{ inputs.refaire }}"

  creer:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350              # dont l'attente éventuelle dans la file (200 min au plus)
    strategy:
      fail-fast: false               # une vidéo ratée n'arrête jamais les autres
      max-parallel: ${{ fromJSON(needs.plan.outputs.paralleles) }}
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.plan) }}
    env:
      MACHINE: ${{ matrix.machine.k }}
      SIMULATION: ${{ inputs.simulation || '0' }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}         # facultatif : vidéos Vimeo sous licence libre
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Retrouver ffmpeg, voix et Whisper déjà téléchargés
        uses: actions/cache@v4
        with:
          path: |
            ~/paquets-ffmpeg
            ~/.cache/buzz-insolite
          key: outils-v1-${{ hashFiles('requirements.txt') }}
      - name: Installer ffmpeg
        timeout-minutes: 25
        run: bash outils/installer_ffmpeg.sh
      - name: Installer les bibliothèques
        run: pip install -q -r requirements.txt
      - name: Installer yt-dlp et deno (vraies vidéos du sujet sous licence libre, YouTube Creative Commons)
        run: pip install -q -U "yt-dlp[default]" || pip install -q -U yt-dlp
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Retrouver la voix d'homme déjà installée (Chatterbox et son modèle)
        id: cache-chatterbox
        uses: actions/cache@v4
        with:
          path: |
            ~/venv-chatterbox
            ~/.cache/huggingface
          key: chatterbox-v1-py312-0.1.7
      - name: Installer la voix d'homme (Chatterbox, espace à part)
        if: steps.cache-chatterbox.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          python -m venv ~/venv-chatterbox
          ~/venv-chatterbox/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          ~/venv-chatterbox/bin/pip install -q chatterbox-tts==0.1.7
          ~/venv-chatterbox/bin/python -c "from chatterbox.mtl_tts import ChatterboxMultilingualTTS as M; M.from_pretrained(device='cpu')"
      - name: Fabriquer (une vidéo par machine)
        run: python -m robot.principal --nombre 1 --sujet "${{ matrix.machine.sujets }}" --libre "$LIBRE" --format "${{ inputs.format || 'buzz' }}" --refaire "$REFAIRE" --etape "$ETAPE" --remarque "$REMARQUE"
        env:
          LIBRE: ${{ inputs.libre }}
          REFAIRE: ${{ inputs.refaire }}
          ETAPE: ${{ inputs.etape || 'auto' }}
          REMARQUE: ${{ inputs.remarque }}
