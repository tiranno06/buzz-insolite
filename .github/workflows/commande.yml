name: Ordre du site
run-name: "Ordre : ${{ inputs.action }} ${{ inputs.id }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "a_publier, retirer, ecarter, supprimer, menage_classique, publier_maintenant, publier_force, publiee, texte, reglages, prononciation, sujet_ignorer, sujet_remettre, buffer_test"
        required: true
      id:
        description: "Identifiant de la vidéo ou du sujet"
        default: ""
      texte:
        description: "Texte, lien ou réglages (JSON)"
        default: ""

permissions:
  contents: write

jobs:
  ordre:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTION: ${{ inputs.action }}
      ID: ${{ inputs.id }}
      TEXTE: ${{ inputs.texte }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Appliquer l'ordre
        run: python -m robot.commande
