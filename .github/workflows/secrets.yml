name: Recherche de clés secrètes (gitleaks)
# Amélioration 26 du 25/11 : le dépôt est PUBLIC ; à chaque envoi, gitleaks (outil libre) cherche une clé d'API, un jeton ou
# un mot de passe écrit par erreur dans le code ou les données. Une fuite fait échouer cette vérification (et prévient par
# e-mail GitHub). --redact : rien de secret n'est recopié dans le journal. Lancé à la main : tout l'historique est relu.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
      - name: Installer gitleaks (version figée, empreinte vérifiée)
        env:
          VERSION: "8.30.0"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -o gl.tar.gz "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o sommes.txt "$base/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" sommes.txt | sed 's/gitleaks_.*/gl.tar.gz/' | sha256sum -c -
          tar -xzf gl.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Chercher des secrets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gitleaks git --redact --no-banner -v .
          else
            gitleaks git --redact --no-banner -v --log-opts="-1" .
          fi
